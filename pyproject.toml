[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finevent"
version = "0.1.0"
description = "FinEvent: NLP × Financial Event and Guidance Revision Detection"
readme = "README.md"
authors = [{ name = "FinEvent Team" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
